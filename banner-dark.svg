<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Vadim Suharnikov, author of the Ferron programming language</title>
  <desc>Banner with the name Vadim Suharnikov, the line "I make Ferron, a programming language", and "frontend, backend, whatever-end". On the right, an editor window holds a five-line Ferron program that prints "hi, I'm Vadim", with that output under it.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f74c00" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f74c00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="880" height="300" rx="12"/></clipPath>
    <clipPath id="window"><rect x="476" y="34" width="374" height="232" rx="12"/></clipPath>
  </defs>
  <style>
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes run { 0%, 18% { opacity: 0; } 24%, 100% { opacity: 1; } }
    @keyframes spark { 0%, 100% { opacity: 0.55; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1); } }
    .spark { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: blink 1.06s steps(1) infinite; }
      .out { animation: run 7s ease-out infinite; }
      .spark { animation: spark 3.2s ease-in-out infinite; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="880" height="300" fill="#0d1117"/>
    <ellipse cx="660" cy="-30" rx="460" ry="240" fill="url(#glow)"/>
    <rect y="294" width="880" height="6" fill="#f74c00"/>
  </g>

  <path class="spark" d="M50 62 l3.4 9.6 l9.6 3.4 l-9.6 3.4 l-3.4 9.6 l-3.4 -9.6 l-9.6 -3.4 l9.6 -3.4 z" fill="#f74c00"/>
  <text x="74" y="80" fill="#f0883e" font-size="13.5" letter-spacing="2">VADIM-SU · YEREVAN, ARMENIA</text>
  <text x="38" y="146" fill="#e6edf3" font-size="43" font-weight="600" letter-spacing="-1.2">Vadim Suharnikov</text>
  <text x="40" y="188" fill="#e6edf3" font-size="17">I make <tspan fill="#f0883e" font-weight="600">Ferron</tspan>, a programming language.</text>
  <text x="40" y="226" fill="#8b949e" font-size="15">frontend · backend · whatever-end</text>

  <g clip-path="url(#window)">
    <rect x="476" y="34" width="374" height="232" fill="#161b22"/>
    <rect x="476" y="34" width="374" height="36" fill="#1c2128"/>
    <rect x="476" y="224" width="374" height="42" fill="#1c2128"/>
  </g>
  <rect x="476" y="34" width="374" height="232" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M476 70 H850 M476 224 H850" stroke="#30363d" stroke-width="1.5"/>
  <g fill="#484f58"><circle cx="498" cy="52" r="5"/><circle cx="516" cy="52" r="5"/><circle cx="534" cy="52" r="5"/></g>
  <text x="556" y="57" fill="#8b949e" font-size="13">hello.fer</text>
  <g font-size="15">
    <text x="502" y="104" xml:space="preserve"><tspan fill="#ff7b72">use</tspan><tspan fill="#e6edf3"> std.env.</tspan><tspan fill="#ffa657">Env</tspan></text>
    <text x="502" y="148" xml:space="preserve"><tspan fill="#ff7b72">fn</tspan><tspan fill="#d2a8ff"> main</tspan><tspan fill="#e6edf3">(env: </tspan><tspan fill="#ffa657">Env</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#ff7b72">-&gt;</tspan><tspan fill="#ffa657"> Unit</tspan><tspan fill="#e6edf3"> {</tspan></text>
    <text x="502" y="170" xml:space="preserve"><tspan fill="#ff7b72">  let</tspan><tspan fill="#e6edf3"> who = </tspan><tspan fill="#a5d6ff">"Vadim"</tspan></text>
    <text x="502" y="192" xml:space="preserve"><tspan fill="#e6edf3">  env.console.</tspan><tspan fill="#d2a8ff">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">"hi, I'm </tspan><tspan fill="#e6edf3">{who}</tspan><tspan fill="#a5d6ff">"</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="502" y="214" xml:space="preserve"><tspan fill="#e6edf3">}</tspan></text>
  </g>
  <g font-size="15">
    <text x="502" y="250" fill="#f0883e">$</text>
    <text class="out" x="522" y="250" fill="#7ee787">hi, I'm Vadim</text>
    <rect class="cursor" x="646" y="237" width="9" height="17" fill="#e6edf3" fill-opacity="0.75"/>
  </g>
</svg>
