<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>Vadim Suharnikov, author of the Ferron programming language</title>
  <desc>Banner with the name Vadim Suharnikov, the line "I make Ferron, a programming language", and "frontend, backend, whatever-end, Yerevan, Armenia". On the right, an editor window holds a five-line Ferron program that prints "hi, I'm Vadim", with that output under it.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f74c00" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#f74c00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="320" rx="14"/></clipPath>
    <clipPath id="window"><rect x="744" y="40" width="456" height="240" rx="12"/></clipPath>
  </defs>
  <style>
    @keyframes blink { 0%, 50% { opacity: 1; } 50.01%, 100% { opacity: 0; } }
    @keyframes run { 0%, 18% { opacity: 0; } 24%, 100% { opacity: 1; } }
    @keyframes spark { 0%, 100% { opacity: 0.55; transform: scale(0.82); } 50% { opacity: 1; transform: scale(1); } }
    .spark { transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: no-preference) {
      .cursor { animation: blink 1.06s steps(1) infinite; }
      .out { animation: run 7s ease-out infinite; }
      .spark { animation: spark 3.2s ease-in-out infinite; }
    }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#0d1117"/>
    <ellipse cx="972" cy="-30" rx="560" ry="250" fill="url(#glow)"/>
    <rect y="314" width="1280" height="6" fill="#f74c00"/>
  </g>

  <path class="spark" d="M88 62 l3.4 9.6 l9.6 3.4 l-9.6 3.4 l-3.4 9.6 l-3.4 -9.6 l-9.6 -3.4 l9.6 -3.4 z" fill="#f74c00"/>
  <text x="112" y="81" fill="#f0883e" font-size="15" letter-spacing="2.4">VADIM-SU</text>
  <text x="78" y="150" fill="#e6edf3" font-size="48" font-weight="600" letter-spacing="-1.2">Vadim Suharnikov</text>
  <text x="80" y="194" fill="#e6edf3" font-size="19">I make <tspan fill="#f0883e" font-weight="600">Ferron</tspan>, a programming language.</text>
  <text x="80" y="234" fill="#8b949e" font-size="15">frontend · backend · whatever-end · Yerevan, Armenia</text>

  <g clip-path="url(#window)">
    <rect x="744" y="40" width="456" height="240" fill="#161b22"/>
    <rect x="744" y="40" width="456" height="38" fill="#1c2128"/>
    <rect x="744" y="236" width="456" height="44" fill="#1c2128"/>
  </g>
  <rect x="744" y="40" width="456" height="240" rx="12" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M744 78 H1200 M744 236 H1200" stroke="#30363d" stroke-width="1.5"/>
  <g fill="#484f58"><circle cx="766" cy="59" r="5"/><circle cx="784" cy="59" r="5"/><circle cx="802" cy="59" r="5"/></g>
  <text x="824" y="64" fill="#8b949e" font-size="13">hello.fer</text>
  <g font-size="15">
    <text x="776" y="110" xml:space="preserve"><tspan fill="#ff7b72">use</tspan><tspan fill="#e6edf3"> std.env.</tspan><tspan fill="#ffa657">Env</tspan></text>
    <text x="776" y="154" xml:space="preserve"><tspan fill="#ff7b72">fn</tspan><tspan fill="#d2a8ff"> main</tspan><tspan fill="#e6edf3">(env: </tspan><tspan fill="#ffa657">Env</tspan><tspan fill="#e6edf3">) </tspan><tspan fill="#ff7b72">-&gt;</tspan><tspan fill="#ffa657"> Unit</tspan><tspan fill="#e6edf3"> {</tspan></text>
    <text x="776" y="176" xml:space="preserve"><tspan fill="#ff7b72">  let</tspan><tspan fill="#e6edf3"> who = </tspan><tspan fill="#a5d6ff">"Vadim"</tspan></text>
    <text x="776" y="198" xml:space="preserve"><tspan fill="#e6edf3">  env.console.</tspan><tspan fill="#d2a8ff">print</tspan><tspan fill="#e6edf3">(</tspan><tspan fill="#a5d6ff">"hi, I'm </tspan><tspan fill="#e6edf3">{who}</tspan><tspan fill="#a5d6ff">"</tspan><tspan fill="#e6edf3">)</tspan></text>
    <text x="776" y="220" xml:space="preserve"><tspan fill="#e6edf3">}</tspan></text>
  </g>
  <g font-size="15">
    <text x="776" y="263" fill="#f0883e">$</text>
    <text class="out" x="796" y="263" fill="#7ee787">hi, I'm Vadim</text>
    <rect class="cursor" x="920" y="250" width="9" height="17" fill="#e6edf3" fill-opacity="0.75"/>
  </g>
</svg>
